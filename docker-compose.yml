# BeBot 스테이징 (emptycan) compose
#
# 실행:
#   BACKEND_TAG=<sha> FRONT_TAG=<sha> docker compose --env-file backend/.env.staging up -d
#   - ${DB_*} 값은 --env-file로 넘긴 backend/.env.staging에서 가져온다
#   - --env-file이나 태그 없이 실행하면 필수 값이 없다는 오류로 중단된다
#   - BACKEND_TAG: Docker Hub에 push한 bebot-backend 이미지 태그
#   - FRONT_TAG: ./deploy/build.sh로 만든 dist/web-<sha> 폴더의 sha
#   - FRONT_PORT: 호스트 포트 (기본 8080. emptycan은 80을 호스트 nginx가 사용 중)
#
# 외부에 열리는 포트는 frontend(nginx) 하나뿐이다.
#   브라우저 → 호스트:8080 → frontend:80 ─┬─ 정적 파일 (dist/web-<sha>)
#                                        └─ /api, /images → backend:8000 ─┬─ redis:6379
#                                                                         └─ postgres:5432
name: bebot

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg18   # 운영과 동일: PostgreSQL 18, pgvector 0.8.1
    restart: unless-stopped
    environment:
      # 빈 volume으로 처음 기동할 때만 적용된다. 이후 값을 바꾸면 volume을 지우고 다시 만들어야 한다
      POSTGRES_DB: ${DB_NAME:?backend/.env.staging의 DB_NAME 필요 (--env-file)}
      POSTGRES_USER: ${DB_USER:?backend/.env.staging의 DB_USER 필요 (--env-file)}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?backend/.env.staging의 DB_PASSWORD 필요 (--env-file)}
    volumes:
      # PG 18 이미지는 데이터가 /var/lib/postgresql/18/docker에 생기므로 상위 경로를 마운트한다
      - pgdata:/var/lib/postgresql
    # 벡터 테이블을 순차 스캔하므로 병렬 쿼리용 공유 메모리를 기본값(64MB)보다 넉넉하게 둔다
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # 외부 포트는 열지 않는다. 접속은 docker compose exec postgres psql ... 로 한다

  redis:
    image: redis:7.4
    restart: unless-stopped
    # 캐시·요청 제한 용도라 volume 없이 둔다. down → up 하면 비어 있는 상태로 시작한다
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: eunsaem338/bebot-backend:${BACKEND_TAG:?BACKEND_TAG 필요 (push한 bebot-backend 이미지 태그)}
    restart: unless-stopped
    env_file: backend/.env.staging
    # 이미지 ENTRYPOINT가 uvicorn이고, 워커 수만 덮어쓴다 (워커마다 리랭커 모델을 따로 올린다)
    command: ["--workers", "${BACKEND_WORKERS:-1}"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 헬스체크는 이미지에 정의된 /api/health 를 그대로 쓴다

  frontend:
    # 운영(S3 + CloudFront)과 같은 정적 파일을 공식 nginx로 서빙한다. 직접 빌드하는 이미지 없음
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${FRONT_PORT:-8080}:80"
    volumes:
      - type: bind
        source: ./dist/web-${FRONT_TAG:?FRONT_TAG 필요 (dist/web-<sha>의 sha)}
        target: /usr/share/nginx/html
        read_only: true
        bind:
          # 폴더가 없을 때 빈 폴더를 만들어 403이 나는 대신 기동을 실패시킨다
          create_host_path: false
      - type: bind
        source: ./deploy/nginx/staging.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    # nginx는 시작할 때 'backend' 이름을 찾으므로 backend가 healthy가 된 뒤 띄운다
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pgdata:
