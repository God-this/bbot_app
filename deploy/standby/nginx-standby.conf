# BeBot 점검 대기 서버(standby) 사이트 설정
#
# 운영 EC2를 정지할 때 Elastic IP를 이 서버로 옮기면, 모든 도메인에 점검 응답을 줌.
#   웹 (bebot.co.kr 등)  → 503 + 점검 페이지
#   API (api.bebot.co.kr) → 503 JSON (+ CORS, preflight 204)
#
# 설치: deploy/standby/standby.sh push (→ /etc/nginx/sites-enabled/bebot-standby)
# 전제: conf.d/maintenance-http.conf, snippets/maintenance-{web,api}.conf,
#       /var/www/maintenance/index.html, /etc/nginx/ssl/bebot/{fullchain,privkey}.pem
#
# 플래그(/var/www/maintenance/ON)는 항상 켜 둠. 플래그가 없거나 관리자 IP라서 통과돼도
# 각 server의 location / 가 다시 503을 내므로 이 서버는 어떤 경우에도 점검 응답만 함.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# 웹
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name bebot.co.kr www.bebot.co.kr bebot.kr www.bebot.kr;

    ssl_certificate     /etc/nginx/ssl/bebot/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/bebot/privkey.pem;

    include snippets/maintenance-web.conf;

    location / {
        return 503;
    }
}

# API
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.bebot.co.kr;

    ssl_certificate     /etc/nginx/ssl/bebot/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/bebot/privkey.pem;

    include snippets/maintenance-api.conf;

    location / {
        return 503;
    }
}
