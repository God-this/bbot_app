<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F8F7F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1D1A" media="(prefers-color-scheme: dark)">
<title>BeBot 점검 안내</title>
<!--
  BeBot 서비스 점검 안내 페이지
  - Nginx가 /var/www/maintenance/index.html로 직접 서빙 (백엔드가 꺼져 있어도 떠야 함)
  - 외부 CDN·웹폰트 금지. CSS·SVG·JS 모두 이 파일 안에 둠
  - 예상 완료 시각: 같은 출처의 /maintenance/info.json (deploy/maintenance.sh on 이 작성)
  - 복구 감지: HEALTH_URL 폴링 (테스트 시 ?health=<url> 로 덮어쓰기)
-->
<style>
:root {
  --bg: #F8F7F4;
  --surface: #FFFFFF;
  --line: #E5E3DE;
  --text: #2C2C2C;
  --text-2: #6B6B6B;
  --primary: #8BA888;
  --primary-light: #B5CDB2;
  --primary-surface: #E8F0E6;
  --primary-dark: #5E7E5B;
  --link: #4A6748;
  --accent: #D4A574;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1A1D1A;
    --surface: #232723;
    --line: #343A34;
    --text: #ECEDEA;
    --text-2: #A9ADA6;
    --primary: #9DBA99;
    --primary-light: #6F8C6C;
    --primary-surface: #2A332A;
    --primary-dark: #B5CDB2;
    --link: #B5CDB2;
    --accent: #DDB78C;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font-family: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont,
    "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
  line-height: 1.6;
  word-break: keep-all;
  -webkit-font-smoothing: antialiased;
}
main {
  flex: 1;
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: 48px 16px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 36px; height: 36px; flex: none; }
.brand-name { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.tagline { margin: 6px 0 0; font-size: 14px; color: var(--text-2); }
.art { width: 100%; max-width: 260px; margin: 32px 0 8px; }
.art svg { display: block; width: 100%; height: auto; }
h1 { margin: 8px 0 12px; font-size: clamp(20px, 5.4vw, 26px); line-height: 1.4; font-weight: 700; letter-spacing: -0.02em; }
.desc { margin: 0; font-size: 16px; color: var(--text-2); }
.panel {
  width: 100%;
  margin-top: 28px;
  padding: 16px 18px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
  font-size: 14px;
  color: var(--text-2);
}
.eta { margin: 0 0 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); color: var(--text); }
.eta strong { font-weight: 700; }
.eta[hidden] { display: none; }
.status { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex: none; animation: pulse 2.4s ease-in-out infinite; }
.recheck {
  margin-top: 10px;
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--text-2);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}
.recheck:hover { border-color: var(--primary); color: var(--text); }
.recheck:focus-visible, a:focus-visible { outline: 2px solid var(--primary-dark); outline-offset: 2px; }
.recheck:disabled { opacity: 0.6; cursor: default; }
.contact { margin: 24px 0 0; font-size: 13px; color: var(--text-2); }
.contact a { color: var(--link); text-underline-offset: 3px; }
footer { padding: 16px; text-align: center; font-size: 12px; color: var(--text-2); }

.sprout { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 7s ease-in-out infinite; }
.tw { animation: twinkle 3.6s ease-in-out infinite; }
.tw.d1 { animation-delay: -0.9s; }
.tw.d2 { animation-delay: -1.8s; }
.tw.d3 { animation-delay: -2.7s; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes twinkle { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.25; } }
@keyframes sway { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
@media (prefers-reduced-motion: reduce) {
  .dot, .tw, .sprout { animation: none; }
}
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <rect width="40" height="40" rx="11" fill="var(--primary)"/>
      <path d="M20 30V18" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M20 22c-4.6 0-7.6-2.8-8-7.4 4.6 0 7.6 2.8 8 7.4Z" fill="#FFFFFF"/>
      <path d="M20 19c.4-5 3.6-8 8.6-8-.4 5-3.6 8-8.6 8Z" fill="#FFFFFF" opacity="0.85"/>
    </svg>
    <span class="brand-name">BeBot</span>
  </div>
  <p class="tagline">창조과학 인공지능 챗봇</p>

  <div class="art">
    <svg viewBox="0 0 220 150" role="img" aria-label="밤하늘의 별 아래에서 자라는 새싹 그림">
      <ellipse cx="110" cy="132" rx="66" ry="9" fill="var(--primary-surface)"/>
      <g class="sprout">
        <path d="M110 131V76" stroke="var(--primary-dark)" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M110 100c-18-1-30-13-32-30 18 1 30 13 32 30Z" fill="var(--primary)"/>
        <path d="M110 84c2-20 16-32 36-33-2 20-16 32-36 33Z" fill="var(--primary-light)"/>
      </g>
      <g fill="var(--accent)">
        <path class="tw" transform="translate(46 44)" d="M0-7 1.8-1.8 7 0 1.8 1.8 0 7-1.8 1.8-7 0-1.8-1.8Z"/>
        <path class="tw d1" transform="translate(168 30)" d="M0-6 1.5-1.5 6 0 1.5 1.5 0 6-1.5 1.5-6 0-1.5-1.5Z"/>
        <path class="tw d2" transform="translate(180 96)" d="M0-5 1.2-1.2 5 0 1.2 1.2 0 5-1.2 1.2-5 0-1.2-1.2Z"/>
        <path class="tw d3" transform="translate(36 104)" d="M0-4.5 1.1-1.1 4.5 0 1.1 1.1 0 4.5-1.1 1.1-4.5 0-1.1-1.1Z"/>
        <circle class="tw d2" cx="84" cy="22" r="2"/>
        <circle class="tw d1" cx="140" cy="16" r="1.6"/>
      </g>
    </svg>
  </div>

  <h1>더 나은 서비스를 위해<br>잠시 점검 중입니다</h1>
  <p class="desc">현재 서비스 업데이트를 진행하고 있습니다.<br>잠시 후 다시 이용해 주세요.</p>

  <div class="panel">
    <p class="eta" id="eta" hidden></p>
    <p class="status" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="status-text">준비가 완료되면 자동으로 새로고침됩니다</span></p>
    <button type="button" class="recheck" id="recheck">지금 다시 확인</button>
  </div>

  <p class="contact">문의 사항은 <a href="https://forms.gle/27ywFtU176sxhYZQ8" target="_blank" rel="noopener">의견 보내기</a>로 남겨 주세요.</p>
</main>
<footer>© BeBot</footer>

<script>
(function () {
  "use strict";

  var params = new URLSearchParams(location.search);
  var HEALTH_URL = params.get("health") || "https://api.bebot.co.kr/api/health";
  var INFO_URL = "/maintenance/info.json";
  var DELAYS = [30, 60, 120]; // 초. 마지막 값을 계속 유지 (복구 직후 요청 몰림 방지)

  var attempt = 0;
  var timer = null;
  var checking = false;
  var statusText = document.getElementById("status-text");
  var recheck = document.getElementById("recheck");

  function getJSON(url) {
    return fetch(url, { cache: "no-store", credentials: "omit" }).then(function (r) {
      if (!r.ok) throw new Error(String(r.status));
      return r.json();
    });
  }

  // 예상 완료 시각 — info.json이 없거나 형식이 맞지 않으면 숨긴 채로 둠
  getJSON(INFO_URL).then(function (info) {
    var start = Date.parse(info.started_at);
    var mins = Number(info.eta_minutes);
    if (!isFinite(start) || !(mins > 0)) return;
    var end = new Date(start + mins * 60000);
    var el = document.getElementById("eta");
    if (Date.now() > end.getTime()) {
      el.textContent = "예상보다 조금 더 걸리고 있습니다. 조금만 기다려 주세요.";
    } else {
      var t = end.toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit", timeZone: "Asia/Seoul" });
      el.innerHTML = "예상 완료 시각 <strong></strong> (한국 시간)";
      el.querySelector("strong").textContent = t;
    }
    el.hidden = false;
  }).catch(function () {});

  // API와 웹이 모두 정상일 때만 새로고침.
  // 계획 점검 중 API가 먼저 살아나도 웹 플래그가 남아 있으면 그대로 대기 (새로고침 루프 방지)
  function check() {
    if (checking) return Promise.resolve();
    checking = true;
    return getJSON(HEALTH_URL)
      .then(function (h) {
        if (!h || h.status !== "ok") throw new Error("not ready");
        return fetch(location.pathname, { method: "HEAD", cache: "no-store", credentials: "omit" });
      })
      .then(function (r) {
        if (!r.ok) throw new Error(String(r.status));
        statusText.textContent = "준비가 완료되었습니다. 곧 새로고침됩니다.";
        location.reload();
      })
      .catch(function () {
        attempt += 1;
        schedule();
      })
      .then(function () { checking = false; });
  }

  function schedule() {
    clearTimeout(timer);
    if (document.hidden) return;
    var sec = DELAYS[Math.min(attempt, DELAYS.length - 1)];
    timer = setTimeout(check, sec * 1000);
  }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      clearTimeout(timer);
    } else {
      schedule();
    }
  });

  recheck.addEventListener("click", function () {
    clearTimeout(timer);
    recheck.disabled = true;
    statusText.textContent = "확인하고 있습니다…";
    check().then(function () {
      statusText.textContent = "준비가 완료되면 자동으로 새로고침됩니다";
      setTimeout(function () { recheck.disabled = false; }, 5000);
    });
  });

  schedule();
})();
</script>
</body>
</html>
