server {
    listen 80;
    root /usr/share/nginx/html;

    # SSE: 버퍼링·압축을 끄고 오래 기다린다.
    # 정확히 일치하는 location이라 아래 /api/ 보다 우선한다.
    # 서버는 [SESSION] 이후 캐시 저장까지 마친 뒤 연결을 닫으므로 timeout을 넉넉히 둔다.
    location = /api/chat/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /images/ {
        proxy_pass http://backend:8000;
    }

    # SPA fallback: /auth/naver/callback 등 파일이 없는 경로는 index.html
    # Flutter 웹은 main.dart.js에 해시를 붙이지 않으므로 매번 재검증하게 한다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
