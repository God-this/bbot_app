# BeBot 점검 모드 로컬 리허설용 — 운영처럼 웹/API를 별도 server 블록으로 흉내 냄
#
# 실행은 deploy/nginx/test/run.sh 사용 (컨테이너 기동, 가짜 백엔드, 플래그 ON/OFF)
#   웹 (bebot.co.kr 역할)     → http://localhost:8088
#   API(api.bebot.co.kr 역할) → http://localhost:8089 → 호스트 8000 (가짜 백엔드)
# 가짜 백엔드가 꺼져 있으면 nginx가 502 → 점검 JSON 폴백 (예기치 않은 다운 재현)

server {
    listen 80 default_server;
    server_name web.test;
    root /usr/share/nginx/html;
    index index.html;

    include snippets/maintenance-web.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 81;
    server_name api.test;

    include snippets/maintenance-api.conf;

    location / {
        proxy_pass http://host.docker.internal:8000;
        proxy_connect_timeout 2s;
    }
}
