# BeBot 점검 모드 로컬 리허설용 — 운영처럼 웹/API를 별도 server 블록으로 흉내 냄
#
# [Mac] 실행 (레포 루트에서, 운영과 같은 nginx 1.28):
#   docker run --rm --name bebot-maint-test -p 8088:80 \
#     -v "$PWD/deploy/nginx/maintenance-http.conf:/etc/nginx/conf.d/maintenance-http.conf:ro" \
#     -v "$PWD/deploy/nginx/test/maintenance-test.conf:/etc/nginx/conf.d/default.conf:ro" \
#     -v "$PWD/deploy/nginx/snippets:/etc/nginx/snippets:ro" \
#     -v "$PWD/deploy/maintenance:/var/www/maintenance:ro" \
#     nginx:1.28
#
# 확인 (Host 헤더로 server 블록 선택):
#   curl -i -H 'Host: web.test' localhost:8088/
#   curl -i -H 'Host: api.test' -H 'Origin: https://bebot.co.kr' localhost:8088/api/health
# 플래그 ON/OFF:
#   MAINT_DIR=deploy/maintenance deploy/maintenance.sh on 30
#   MAINT_DIR=deploy/maintenance deploy/maintenance.sh off

server {
    listen 80 default_server;
    server_name web.test;
    root /usr/share/nginx/html;
    index index.html;

    include snippets/maintenance-web.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name api.test;

    include snippets/maintenance-api.conf;

    # 일부러 닫힌 포트 → 백엔드 다운(502) 폴백 확인용
    location / {
        proxy_pass http://127.0.0.1:9;
    }
}
