# BeBot 점검 모드 — http 컨텍스트용 변수 정의
#
# 설치: /etc/nginx/conf.d/maintenance-http.conf
#       (Ubuntu 기본 nginx.conf는 http 블록 안에서 conf.d/*.conf를 include함)
# 함께 쓰는 파일:
#   snippets/maintenance-web.conf  → bebot.co.kr server 블록
#   snippets/maintenance-api.conf  → api.bebot.co.kr server 블록

# 점검 모드에서도 정상 서비스로 통과시킬 관리자 IP (배포 직후 직접 확인용)
geo $maint_bypass {
    default 0;
    # 203.0.113.10/32 1;   # 예시 — 실제 관리자 IP로 교체
}

# 점검 JSON 응답에 붙일 CORS 허용 출처.
# 평소에는 FastAPI가 CORS 헤더를 붙이지만, 백엔드가 꺼져 있으면 Nginx가 대신 붙여야
# 웹 앱이 503 본문을 읽을 수 있음. 빈 값이면 add_header가 헤더를 생략함.
map $http_origin $maint_cors_origin {
    default "";
    "https://bebot.co.kr"     $http_origin;
    "https://www.bebot.co.kr" $http_origin;
}
