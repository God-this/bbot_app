# BeBot 점검 모드 — API(api.bebot.co.kr) server 블록용
#
# 설치: /etc/nginx/snippets/maintenance-api.conf
#       server { server_name api.bebot.co.kr; include snippets/maintenance-api.conf; ... }
# 전제: conf.d/maintenance-http.conf ($maint_bypass, $maint_cors_origin)
#
# 다음 두 경우 모두 JSON 503으로 응답:
#   1) 계획 점검: /var/www/maintenance/ON 파일이 있을 때 (관리자 IP 제외)
#   2) 예기치 않은 다운: 백엔드 연결 실패/타임아웃으로 nginx가 502/504를 낼 때
# Flutter 앱은 503 + {"status":"maintenance"}로 점검 상태를 판단함.
#
# 주의: 이 server 블록 안의 location에 자체 error_page가 있으면 아래 error_page가
#       상속되지 않음 — 그 location에도 error_page 502 503 504 = @maintenance_api; 추가

set $maint 0;
if (-f /var/www/maintenance/ON) {
    set $maint 1;
}
if ($maint_bypass) {
    set $maint 0;
}
if ($maint) {
    return 503;
}

# '=' → 최종 상태코드를 아래 location의 return 값으로 결정 (JSON 503, preflight 204)
error_page 502 503 504 = @maintenance_api;

location @maintenance_api {
    default_type "application/json; charset=utf-8";
    add_header Retry-After 300 always;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin $maint_cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Vary "Origin" always;

    # 점검 중 CORS preflight에 응답하지 않으면 브라우저가 본 요청을 보내지 않아
    # 앱이 점검 JSON 대신 네트워크 오류를 받음.
    # (if 안에 add_header가 있으면 바깥 add_header는 상속되지 않으므로 다시 적음)
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $maint_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
        add_header Access-Control-Max-Age 60 always;
        add_header Vary "Origin" always;
        return 204;
    }

    return 503 '{"status":"maintenance","message":"서비스 점검 중입니다. 잠시 후 다시 이용해 주세요.","retry_after":300}';
}
