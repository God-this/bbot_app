# BeBot 점검 모드 — 웹(bebot.co.kr) server 블록용
#
# 설치: /etc/nginx/snippets/maintenance-web.conf
#       server { server_name bebot.co.kr ...; include snippets/maintenance-web.conf; ... }
# 전제: conf.d/maintenance-http.conf ($maint_bypass)
#
# /var/www/maintenance/ON 파일이 있으면 모든 요청에 503 + 점검 페이지.
# 웹은 백엔드와 무관한 정적 서빙이라 플래그가 있을 때만 점검 페이지를 보여줌.
# 플래그는 매 요청마다 확인하므로 ON/OFF 전환에 reload가 필요 없음.
#
# 주의: 이 server 블록 안의 location에 자체 error_page가 있으면 아래 error_page가
#       상속되지 않음 (nginx 상속 규칙) — 그 location에도 error_page 503 @maintenance_web; 추가

set $maint 0;
if (-f /var/www/maintenance/ON) {
    set $maint 1;
}
if ($maint_bypass) {
    set $maint 0;
}
# 점검 페이지가 읽는 info.json은 점검 중에도 응답해야 함
if ($uri ~ "^/maintenance/") {
    set $maint 0;
}
if ($maint) {
    return 503;
}

location ^~ /maintenance/ {
    root /var/www;
    add_header Cache-Control "no-store" always;
}

# '=' 없이 지정 → 점검 페이지를 상태코드 503 그대로 응답
error_page 503 @maintenance_web;

location @maintenance_web {
    root /var/www/maintenance;
    add_header Retry-After 300 always;
    add_header Cache-Control "no-store" always;
    rewrite ^ /index.html break;
}
